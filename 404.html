<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanzekai | 404 Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <div id="header-placeholder"></div>

    <main class="flex-grow flex flex-col justify-center items-center pt-28 pb-16 px-6 text-center relative overflow-hidden">
        
        <!-- Background Effects -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-gradient-to-tr from-blue-500/20 to-emerald-500/20 blur-3xl rounded-full -z-10"></div>
        
        <h1 class="text-8xl md:text-9xl font-extrabold mb-4 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
            404
        </h1>
        
        <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">
            Halaman Tidak Ditemukan
        </h2>
        
        <p class="text-slate-400 max-w-md mb-8 leading-relaxed">
            Maaf, halaman yang Anda cari mungkin telah dihapus, namanya diubah, atau sementara tidak tersedia.
        </p>
        
        <a href="/" class="bg-blue-600 hover:bg-blue-500 text-white px-7 py-3 rounded-xl font-semibold transition-all shadow-lg shadow-blue-900/20 flex items-center gap-2">
            <i class="fa-solid fa-house text-sm"></i> Kembali ke Beranda
        </a>
        
    </main>

    <div id="footer-placeholder"></div>

    <script src="/assets/script.js"></script>
</body>
</html>
